<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/vs-official.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vision &amp; Solution Shipment Management System — bilingual transportation operations workspace."
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Vision &amp; Solution | Shipment Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Resolve browser preferences before first paint to avoid a direction/theme flash.
      try {
        const locale = localStorage.getItem('vs.locale.v1') === 'ar' ? 'ar' : 'en'
        const savedTheme = localStorage.getItem('vs.theme.v1')
        const theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.lang = locale
        document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch {
        /* The application also supports in-memory preferences. */
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
