# Local development only. No hosted project is linked by this configuration.
project_id = "vision-solution-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# The CLI maps this provider flag to GOTRUE_EXTERNAL_EMAIL_ENABLED.
# Global auth.enable_signup=false above still denies all public registration.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[analytics]
enabled = false

[edge_runtime]
enabled = false
